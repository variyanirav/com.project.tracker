name: project_tracker
description: "A professional time tracking, focus, and task management application for macOS. Track billable hours on projects and tasks with archive functionality, real-time reporting, a standalone Focus Timer, and CSV export for billing."
publish_to: "none"
version: 1.4.1+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  csv: ^6.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # UI/Theme
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

  # Code Generation
  build_runner: ^2.4.0
  drift_dev: ^2.16.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/logo/logo.png"
  macos:
    generate: true
